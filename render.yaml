services:
  - type: web
    name: break-mcp
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MCP_USERS_JSON
        sync: false
      - key: MCP_SESSION_SECRET
        generateValue: true
      - key: MCP_URL
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_BUSINESS_ID
        sync: false
      - key: META_GRAPH_VERSION
        value: v21.0
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GADS_DEVELOPER_TOKEN
        sync: false
      - key: GADS_CLIENT_ID
        sync: false
      - key: GADS_CLIENT_SECRET
        sync: false
      - key: GADS_REFRESH_TOKEN
        sync: false
      - key: GADS_LOGIN_CUSTOMER_ID
        sync: false
      - key: GADS_API_VERSION
        value: v18
      - key: CLIENTS_JSON
        sync: false
